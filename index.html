<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0D16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Billetera Sergio &amp; Cumba</title>
<style>
/* Layout: one phone-width column; sticky profile header, scrolling cards, glass tab bar with a center add button. Dark-first. */
:root{
  --bg:#0E0D16; --surface:#17162A; --surface2:#211F38; --line:#2C2A48;
  --fg:#F3F1FB; --muted:#9C98BC; --faint:#6B6790;
  --good:#3DDC84; --warn:#FFB020; --bad:#FF5A5F;
  --acc:#6E7CFF; --acc2:#A45CFF; --on-acc:#FFFFFF;
  --grad:linear-gradient(135deg,#4F7CFF 0%,#9B5CFF 100%);
  --display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:22px; --sat:0px; --sab:0px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F3FA; --surface:#FFFFFF; --surface2:#EEEDF7; --line:#E1DFEE;
  --fg:#17152B; --muted:#635F85; --faint:#9A97B5; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F4F3FA; --surface:#FFFFFF; --surface2:#EEEDF7; --line:#E1DFEE;
  --fg:#17152B; --muted:#635F85; --faint:#9A97B5; color-scheme:light;
}
:root[data-profile="cumba"]{
  --acc:#FF8A1F; --acc2:#2FB8FF;
  --grad:linear-gradient(120deg,#FF3D57 0%,#FF8A1F 22%,#F5C518 40%,#2FD27A 58%,#20B0FF 78%,#8B4DFF 100%);
}
:root[data-profile="all"]{
  --acc:#1FC9B0; --acc2:#4F7CFF;
  --grad:linear-gradient(135deg,#14B8A6 0%,#4F7CFF 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Discreet mode */
.discreet .amt{filter:blur(7px);transition:filter .2s}
.discreet .amt:active{filter:none}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--bg)}
.hdr{position:sticky;top:var(--sat);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hdr .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 10px 4px 4px;border-radius:999px;min-width:0}
.who:hover{background:var(--surface)}
.who b{font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:12px;text-align:left;white-space:nowrap}
.who>span{text-align:left;display:block}
.who b{display:block}
.hdr .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--grad);color:#fff;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc)}
.av img{width:100%;height:100%;object-fit:cover}
.av.dark{background:#0E0D16}
.av.lg{width:84px;height:84px;font-size:32px}
.av.sm{width:30px;height:30px;font-size:12px;box-shadow:none}

main{padding-bottom:calc(110px + var(--sab))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card .sub{color:var(--muted);font-size:13px}
.link{background:none;border:0;color:var(--acc);font-weight:600;font-size:13px;padding:4px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Hero */
.hero{position:relative;border-radius:26px;padding:20px 18px 18px;color:#fff;background:var(--grad);overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(180deg,transparent 40%,rgba(10,8,25,.35));z-index:-1}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero .big{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .of{color:rgba(255,255,255,.85);font-size:14px}
.meter{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.25);margin-top:14px;overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:#fff;max-width:100%}
.meter i.w{background:#FFE08A}.meter i.x{background:#FFC2C4}
.meter .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(20,10,40,.7);border-radius:2px}
.hero .left{margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.92)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pill{background:rgba(255,255,255,.16);border-radius:16px;padding:9px 10px;backdrop-filter:blur(6px)}
.pill>span{display:block;font-size:11.5px;color:rgba(255,255,255,.8)}
.pill b{font-family:var(--display);font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flow div{background:var(--surface2);border-radius:16px;padding:10px 12px}
.flow div>span{font-size:11.5px;color:var(--muted);display:block}
.flow b{font-family:var(--display);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow>div,.pill{min-width:0}

/* Category chips like the reference */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;margin-top:12px}
.cchip{text-align:center;min-width:0;background:none;border:0;padding:4px 2px;border-radius:12px}
.cchip .ic{font-size:22px;line-height:1}
.cchip .nm{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cchip .bar{height:6px;border-radius:6px;margin:5px auto 3px;width:72%}
.cchip .v{font-size:12.5px;font-weight:600}
.donut-wrap{display:flex;justify-content:center;margin-top:8px}
.donut text{fill:var(--fg);font-family:var(--display)}
.donut .lbl{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* Lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .am{font-weight:700;white-space:nowrap;font-family:var(--display);font-size:15.5px}
.am.in{color:var(--good)}
.day-h{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:600;padding:12px 2px 2px;text-transform:capitalize}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.acc{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--fg)}
.tag.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--fg)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* Progress */
.prog{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:8px;background:var(--acc)}
.prog i.w{background:var(--warn)}.prog i.x{background:var(--bad)}.prog i.g{background:var(--good)}
.brow{padding:8px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.brow .t span:last-child{color:var(--muted);white-space:nowrap}

/* Insights */
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ins:last-child{border-bottom:0}
.ins .dot{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--surface2)}
.ins.bad .dot{background:color-mix(in srgb,var(--bad) 25%,transparent)}
.ins.good .dot{background:color-mix(in srgb,var(--good) 22%,transparent)}
.ins.warn .dot{background:color-mix(in srgb,var(--warn) 25%,transparent)}

/* Banners */
.banner{display:flex;gap:10px;align-items:center;border-radius:16px;padding:11px 12px;background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);font-size:13.5px}
.banner .tx{flex:1}
.banner button{flex:none}

/* Buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--grad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* Segmented */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--faint);font-weight:600;padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke:var(--acc)}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;border:0;background:var(--grad);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 24px -6px color-mix(in srgb,var(--acc) 70%,transparent),0 0 0 5px var(--bg)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,5,14,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--sat) - 18px);overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(22px + var(--sab)) max(16px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line);border-bottom:0;overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 8px}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding-block:6px;z-index:2}
.sheet .sh h2{font-size:20px;flex:1}
.sheet .body{display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* Forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.amount{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0 2px}
.amount input{background:none;border:0;outline:none;font-family:var(--display);font-weight:800;font-size:44px;text-align:center;width:100%;min-width:0;letter-spacing:-.02em}
.amount select{background:var(--surface2);border:0;border-radius:10px;padding:6px 8px;font-weight:700;font-size:13px}
.conv{text-align:center;color:var(--muted);font-size:13px;min-height:18px}
.catpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catpick button{border:1.5px solid transparent;background:var(--surface);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.catpick button span:first-child{font-size:22px;line-height:1}
.catpick button span:last-child{font-size:11px;color:var(--muted);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.catpick button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--surface))}
.catpick button.on span:last-child{color:var(--fg)}
.switch{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.switch .tx{flex:1;font-size:14px}
.switch .tx small{display:block;color:var(--muted);font-size:12px}
.tg{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg:checked{background:var(--good)}
.tg:checked::after{transform:translateX(20px)}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:14px}
.emo{display:flex;gap:6px;flex-wrap:wrap}
.emo button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px}
.emo button.on{border-color:var(--acc)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--fg)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:left;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu .mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-size:16px;flex:none}
.menu .tx{flex:1;min-width:0}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu .chev{color:var(--faint)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note b{color:var(--fg)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:9.5px;font-family:var(--body)}
.chart .bar{fill:var(--acc)}
.chart .bar.hi{fill:var(--acc2)}
.chart .bar.dim{fill:color-mix(in srgb,var(--acc) 35%,var(--surface2))}
.chart .ref{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .ln{stroke:var(--acc);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:color-mix(in srgb,var(--acc) 22%,transparent)}
.chart .end{fill:var(--acc);stroke:var(--surface);stroke-width:2}
.chart .reflbl{fill:var(--warn);font-size:9.5px;font-weight:600}
.legend{display:flex;flex-direction:column;margin-top:8px}
.lg{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg:last-child{border-bottom:0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .p{color:var(--muted);font-size:12.5px;width:42px;text-align:right}
.lg .d{font-size:12px;width:56px;text-align:right}
.up{color:var(--bad)}.down{color:var(--good)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.tile>span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--display);font-size:20px;margin-top:2px}
.tile small{font-size:12px}
.pnav{display:flex;align-items:center;gap:8px}
.pnav b{flex:1;text-align:center;font-family:var(--display);font-size:17px;text-transform:capitalize}
.rule{display:flex;flex-direction:column;gap:10px}
.rule .t{display:flex;justify-content:space-between;font-size:13.5px}
.rule .bar2{position:relative;height:10px;border-radius:10px;background:var(--surface2);overflow:hidden}
.rule .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:10px}
.rule .bar2 em{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.6}

/* Lock screen */
.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(30px + var(--sat)) 24px calc(30px + var(--sab));text-align:center;background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,#8B4DFF 28%,transparent),transparent 70%),var(--bg)}
.lock .logo{width:96px;height:96px;filter:drop-shadow(0 8px 24px rgba(139,77,255,.35))}
.lock h1{font-size:30px;font-weight:800}
.lock p{color:var(--muted);margin:0;max-width:34ch;font-size:14.5px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--fg);border-color:var(--fg)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);font-family:var(--display);font-size:28px;font-weight:600}
.pad button:active{background:var(--surface2)}
.pad button.txt{background:none;font-size:14px;font-family:var(--body);color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.feat{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:360px;width:100%}
.feat div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.feat span{font-size:20px}
.feat p{font-size:13.5px}
.feat b{display:block;color:var(--fg);font-size:14.5px}

/* Toasts */
.toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 10px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:up .25s}
.toast.bad{background:var(--bad);color:#fff}
.toast.warn{background:var(--warn);color:#1a1300}

#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;color:#111;background:#fff;font-family:var(--body);padding:10mm}
  #print-area h1{font-size:22px;margin-bottom:4px}
  #print-area table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
  #print-area td,#print-area th{border-bottom:1px solid #ddd;padding:5px;text-align:left}
  #print-area .r{text-align:right}
  body{background:#fff}
}

/* Registro rápido */
.qbox{position:relative}
.qbox textarea{min-height:96px;padding-right:66px;font-size:17px}
.mic{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
.mic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 25%,transparent)}}

:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

const pad = n => String(n).padStart(2, '0');

const DB = {
  db: null, mem: null,
  async open() {
    if (this.db || this.mem) return;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('billetera', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.mem = new Map(); STORAGE_WARN = true; }
  },
  async op(mode, fn) {
    await this.open();
    if (this.mem) return fn(null);
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode); const st = t.objectStore('kv'); let out;
      const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.mem ? Promise.resolve(this.mem.get(k)) : this.op('readonly', s => s.get(k)); },
  set(k, v) { if (this.mem) { this.mem.set(k, v); return Promise.resolve(); } return this.op('readwrite', s => s.put(v, k)); },
  del(k) { if (this.mem) { this.mem.delete(k); return Promise.resolve(); } return this.op('readwrite', s => s.delete(k)); },
  keys() { return this.mem ? Promise.resolve([...this.mem.keys()]) : this.op('readonly', s => s.getAllKeys()); },
  clear() { if (this.mem) { this.mem.clear(); return Promise.resolve(); } return this.op('readwrite', s => s.clear()); },

/* ---------- Gráficas (SVG propio, sin librerías externas) ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barChart(data, { ref = null, refLabel = '', hi = -1 } = {}) {
  const W = 340, H = 170, L = 52, R = 6, T = 12, B = 22, w = W - L - R, h = H - T - B;
  const max = niceMax(Math.max(...data.map(d => d.value), ref || 0, 1));
  const y = v => T + h - v / max * h, n = data.length, bw = w / n;
  const every = n > 16 ? Math.ceil(n / 8) : 1;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de barras">`;
  [0, .5, 1].forEach(f => { const v = max * f; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; });
  data.forEach((d, i) => {
    const bh = Math.max(d.value > 0 ? 2 : 0, d.value / max * h), x = L + i * bw + bw * .18;
    s += `<rect class="bar ${i === hi ? 'hi' : d.dim ? 'dim' : ''}" x="${x.toFixed(1)}" y="${(T + h - bh).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(4, bw * .25).toFixed(1)}"><title>${esc(d.label)}: ${money(d.value)}</title></rect>`;
    if (i % every === 0) s += `<text class="ax" x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  if (ref) s += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/><text class="reflbl" x="${W - R}" y="${y(ref) - 4}" text-anchor="end">${esc(refLabel)}</text>`;
  return s + '</svg>';
}
function paceChart(cum, days, budget, upto) {
  const W = 340, H = 170, L = 52, R = 8, T = 12, B = 22, w = W - L - R, h = H - T - B;
  const max = niceMax(Math.max(budget, cum[cum.length - 1] || 0, 1));
  const x = i => L + (i / Math.max(days - 1, 1)) * w, y = v => T + h - v / max * h;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ritmo de gasto acumulado">`;
  [0, .5, 1].forEach(f => { const v = max * f; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; });
  [1, Math.ceil(days / 2), days].forEach(d => { s += `<text class="ax" x="${x(d - 1)}" y="${H - 6}" text-anchor="middle">${d}</text>`; });
  if (budget) s += `<line class="ref" x1="${x(0)}" y1="${y(0)}" x2="${x(days - 1)}" y2="${y(budget)}"/><text class="reflbl" x="${x(days - 1)}" y="${y(budget) - 5}" text-anchor="end">ritmo ideal</text>`;
  const pts = cum.slice(0, upto).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  if (pts.length) {
    s += `<path class="area" d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(upto - 1)},${y(0)} Z"/><polyline class="ln" points="${pts.join(' ')}"/>`;
    s += `<circle class="end" cx="${x(upto - 1)}" cy="${y(cum[upto - 1])}" r="4.5"/>`;
  }
  return s + '</svg>';
}
function donut(items, center, sub) {
  const R = 62, SW = 24, C = 2 * Math.PI * R, tot = sum(items, i => i.value);
  let off = 0, s = `<svg class="donut" viewBox="0 0 170 170" width="190" height="190" role="img" aria-label="Distribución por categoría">`;
  s += `<circle cx="85" cy="85" r="${R}" fill="none" style="stroke:var(--surface2)" stroke-width="${SW}"/>`;
  if (tot > 0) items.forEach(it => {
    const len = it.value / tot * C, gap = items.length > 1 ? Math.min(2, len * .3) : 0;
    s += `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${it.color}" stroke-width="${SW}" stroke-dasharray="${Math.max(len - gap, 0.01).toFixed(2)} ${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 85 85)"><title>${esc(it.label)}: ${money(it.value)}</title></circle>`;
    off += len;
  });
  s += `<text class="lbl" x="85" y="73" text-anchor="middle">${esc(sub)}</text><text class="amt" x="85" y="96" text-anchor="middle" font-size="19" font-weight="800">${esc(center)}</text>`;
  return s + '</svg>';
}
function topN(items, n = 7) {
  if (items.length <= n) return items;
  const head = items.slice(0, n - 1), rest = items.slice(n - 1);
  return [...head, { id: '_rest', label: 'Otras', icon: '•', color: '#A0A4B8', value: sum(rest, r => r.value) }];
}

function monthCtx(P = UI.profile, d = new Date()) {
  const r = range('month', d), spent = sum(txIn(r.from, r.to, P, 'expense')), inc = sum(txIn(r.from, r.to, P, 'income'));
  const days = daysIn(d), dayN = d.getDate(), budget = budgetOf(P);
  return { r, spent, inc, days, dayN, budget, saved: savedIn(r.from, r.to, P) };
}
function pendingRecurring() {
  const now = new Date(), cur = ym(now), dnow = now.getDate();
  return S.recurring.filter(r => r.active && r.last !== cur && Math.min(r.day, daysIn(now)) <= dnow && (!r.start || r.start <= today()));
}
function dueDebts(P = UI.profile) {
  const now = new Date(), cur = ym(now);
  return S.debts.filter(d => inProf(d, P) && d.dir === 'owe' && !d.closed && d.dueDay && d.monthly)
    .filter(d => !S.debtPays.some(p => p.debt === d.id && p.date.startsWith(cur)))
    .map(d => { let due = new Date(now.getFullYear(), now.getMonth(), Math.min(d.dueDay, daysIn(now))); return { d, due, days: Math.round((due - dayStart(now)) / 864e5) }; })
    .filter(x => x.days <= 7).sort((a, b) => a.days - b.days);
}
function reimbPending() {
  const out = [];
  PROFS.forEach(p => { const list = S.tx.filter(t => t.profile === p && t.paidBy && !t.reimbursed); if (list.length) out.push({ debtor: p, creditor: list[0].paidBy, list, total: sum(list) }); });
  return out;
}
function insights(P = UI.profile) {
  const out = [], now = new Date(), c = monthCtx(P, now);
  if (c.spent === 0 && c.inc === 0) return out;
  if (c.budget > 0 && c.dayN >= 3) {
    const proj = c.spent / c.dayN * c.days;
    if (proj > c.budget * 1.02) out.push({ k: 'bad', i: '📉', t: `A este ritmo cerrarás ${MES[now.getMonth()]} en <b>${amt(proj)}</b>, unos ${amt(proj - c.budget)} por encima del presupuesto.` });
    else out.push({ k: 'good', i: '✅', t: `Vas bien: a este ritmo terminarías el mes en <b>${amt(proj)}</b>, dentro del presupuesto.` });
  }
  const r = c.r, prevFrom = ds(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  const prevTo = ds(addDays(new Date(now.getFullYear(), now.getMonth() - 1, Math.min(c.dayN, daysIn(new Date(now.getFullYear(), now.getMonth() - 1, 1)))), 1));
  const cur = byCat(txIn(r.from, ds(addDays(now, 1)), P, 'expense')), prev = new Map(byCat(txIn(prevFrom, prevTo, P, 'expense')).map(x => [x.id, x.value]));
  let best = null;
  cur.forEach(x => { const p = prev.get(x.id) || 0; const diff = x.value - p; if (p > 0 && diff / p >= .2 && diff >= 40000 && (!best || diff > best.diff)) best = { ...x, diff, p }; });
  if (best) out.push({ k: 'warn', i: best.icon, t: `Llevas ${amt(best.value)} en <b>${esc(best.label)}</b>, ${pct(best.diff, best.p)} % más que a esta altura del mes pasado.` });
  if (cur[0] && c.spent) out.push({ k: '', i: cur[0].icon, t: `Tu mayor gasto del mes es <b>${esc(cur[0].label)}</b>: ${pct(cur[0].value, c.spent)} % del total.` });
  const spentDays = new Set(txIn(r.from, ds(addDays(now, 1)), P, 'expense').map(t => t.date));
  const free = c.dayN - spentDays.size;
  if (free >= 2) out.push({ k: 'good', i: '🌱', t: `Llevas <b>${free} días sin gastos</b> este mes. Cada día así suma.` });
  const fs = S.savings.filter(f => inProf(f, P) && f.goal && f.deadline && fundBal(f) < f.goal);
  if (fs.length) {
    const f = fs[0], months = Math.max(1, (pd(f.deadline).getFullYear() - now.getFullYear()) * 12 + pd(f.deadline).getMonth() - now.getMonth());
    out.push({ k: '', i: f.icon || '🐷', t: `Para llegar a <b>${esc(f.name)}</b> a tiempo necesitas ahorrar ${amt((f.goal - fundBal(f)) / months)} al mes.` });
  }

}
async function checkAlerts(profile) {
  const now = new Date(), key = ym(now), r = range('month', now);
  const fire = async (id, title, body, kind) => { if (S.alertsSeen[id]) return; S.alertsSeen[id] = 1; persist(); toast(body, kind); notify(title, body); };
  const pr = S.profiles[profile], spent = sum(txIn(r.from, r.to, profile, 'expense'));
  if (pr.budget > 0) {
    const p = spent / pr.budget;
    if (p >= 1) await fire(`${profile}:all:${key}:100`, 'Presupuesto superado', `${pr.name} superó el presupuesto de ${MES[now.getMonth()]}.`, 'bad');
    else if (p >= .8) await fire(`${profile}:all:${key}:80`, 'Presupuesto al 80 %', `${pr.name} ya usó el ${Math.round(p * 100)} % del presupuesto del mes.`, 'warn');
  }
  S.cats.filter(c => c.profile === profile && c.kind === 'expense' && c.budget > 0).forEach(c => {
    const v = sum(txIn(r.from, r.to, profile, 'expense').filter(t => t.cat === c.id)), p = v / c.budget;
    if (p >= 1) fire(`${profile}:${c.id}:${key}:100`, 'Categoría superada', `${c.name} (${pr.name}) superó su presupuesto.`, 'bad');
    else if (p >= .8) fire(`${profile}:${c.id}:${key}:80`, 'Categoría al 80 %', `${c.name} (${pr.name}) va en ${Math.round(p * 100)} % de su presupuesto.`, 'warn');
  });
}

}

    h += sec('Lo que debo', owe, 'owe') + sec('Lo que me deben', owed, 'owed');
    const closed = ds_.filter(d => d.closed);
    if (closed.length) h += `<section class="card"><h3>Saldadas 🎉</h3><div class="list">${closed.map(d => `<button class="row" data-act="debt" data-id="${d.id}"><span class="ci" style="background:var(--surface2)">✓</span><span class="tx"><b>${esc(d.name)}</b><small>${esc(d.who || '')}</small></span><span class="am num">${amt(d.total)}</span></button>`).join('')}</div></section>`;
  }
  return h;
}

function viewReports() {
  const P = UI.profile, r = range(UI.period, UI.anchor);
  const ex = txIn(r.from, r.to, P, 'expense'), inc = txIn(r.from, r.to, P, 'income'), pex = txIn(r.prevFrom, r.prevTo, P, 'expense');
  const E = sum(ex), I = sum(inc), PE = sum(pex), SV = savedIn(r.from, r.to, P);
  const nDays = Math.max(1, Math.round((r.toD - r.fromD) / 864e5)), elapsed = Math.max(1, Math.min(nDays, Math.round((dayStart(new Date()) - r.fromD) / 864e5) + 1));
  const dlt = PE ? Math.round((E - PE) / PE * 100) : null;
  const isFuture = r.from > today();
  let h = `<div class="seg">${[['day', 'Día'], ['week', 'Semana'], ['month', 'Mes'], ['year', 'Año']].map(([k, l]) => `<button class="${UI.period === k ? 'on' : ''}" data-act="period" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="pnav"><button class="ib" data-act="pnav" data-d="-1" aria-label="Periodo anterior">${IC.left}</button><b>${esc(r.label)}</b><button class="ib" data-act="pnav" data-d="1" aria-label="Periodo siguiente" ${isFuture ? 'disabled' : ''}>${IC.right}</button></div>
    <div class="tiles"><div class="tile"><span>Gastos</span><b>${amt(E)}</b>${dlt !== null ? `<small class="${dlt > 0 ? 'up' : 'down'}">${dlt > 0 ? '▲' : '▼'} ${Math.abs(dlt)} % vs. anterior</small>` : '<small class="sub">Sin datos del periodo anterior</small>'}</div>
    <div class="tile"><span>Ingresos</span><b style="color:var(--good)">${amt(I)}</b><small class="sub">Ahorrado ${short(SV)}</small></div>
    <div class="tile"><span>Balance</span><b class="${I - E - SV < 0 ? 'up' : ''}">${amt(I - E - SV)}</b><small class="sub">Ingresos − gastos − ahorro</small></div>
    <div class="tile"><span>Promedio diario</span><b>${amt(E / (UI.period === 'day' ? 1 : r.to > today() ? elapsed : nDays))}</b><small class="sub">${ex.length} gasto${ex.length === 1 ? '' : 's'}</small></div></div>`;

  // Gráfica principal
  let chart = '', ctitle = '';
  if (UI.period === 'week') {
    ctitle = 'Gasto por día';
    const data = Array.from({ length: 7 }, (_, i) => { const d = ds(addDays(r.fromD, i)); return { label: DIA[i], value: sum(ex.filter(t => t.date === d)) }; });
    const b = budgetOf(P); chart = barChart(data, { ref: b ? b / daysIn(r.fromD) : null, refLabel: 'diario ideal', hi: data.findIndex((_, i) => ds(addDays(r.fromD, i)) === today()) });
  } else if (UI.period === 'month') {
    ctitle = 'Gasto por día';
    const dn = daysIn(r.fromD), data = Array.from({ length: dn }, (_, i) => { const d = ds(addDays(r.fromD, i)); return { label: String(i + 1), value: sum(ex.filter(t => t.date === d)) }; });
    const b = budgetOf(P); chart = barChart(data, { ref: b ? b / dn : null, refLabel: 'diario ideal', hi: data.findIndex((_, i) => ds(addDays(r.fromD, i)) === today()) });
    let acc = 0; const cum = data.map(d => acc += d.value);
    const upto = r.to <= today() ? dn : r.from > today() ? 0 : new Date().getDate();
    chart += `<h3 style="margin:16px 0 4px">Ritmo de gasto del mes</h3><div class="sub" style="margin-bottom:6px">Gasto acumulado frente al presupuesto${b ? ' de ' + short(b) : ''}</div>` + paceChart(cum, dn, b, upto);
  } else if (UI.period === 'year') {
    ctitle = 'Gasto por mes';
    const y = r.fromD.getFullYear(), data = MESC.map((m, i) => ({ label: m, value: sum(ex.filter(t => t.date.startsWith(`${y}-${pad(i + 1)}`))) }));
    const b = budgetOf(P); chart = barChart(data, { ref: b || null, refLabel: 'presupuesto', hi: y === new Date().getFullYear() ? new Date().getMonth() : -1 });
  }
  if (chart) h += `<section class="card"><h3>${ctitle}</h3><div style="margin-top:8px">${chart}</div></section>`;

  const cats = byCat(ex), prevMap = new Map(byCat(pex).map(x => [x.id, x.value]));
  h += `<section class="card"><h3>Por categoría</h3>`;
  if (cats.length) {
    h += `<div class="donut-wrap">${donut(topN(cats, 8), short(E), 'Gastos')}</div><div class="legend">${cats.map(x => { const p = prevMap.get(x.id) || 0, d = p ? Math.round((x.value - p) / p * 100) : null; return `<button class="lg" data-act="filterCat" data-id="${x.id}" style="background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left"><i style="background:${x.color}"></i><span class="n">${esc(x.icon)} ${esc(x.label)}</span><span class="d ${d > 0 ? 'up' : d < 0 ? 'down' : 'sub'}">${d === null ? (prevMap.size ? 'nuevo' : '') : (d > 0 ? '▲' : d < 0 ? '▼' : '') + Math.abs(d) + ' %'}</span><span class="p">${pct(x.value, E)} %</span><span class="num amt">${short(x.value)}</span></button>`; }).join('')}</div>`;
  } else h += `<div class="empty">No hay gastos en este periodo.</div>`;
  h += `</section>`;

  if (UI.period === 'day' && ex.length + inc.length) h += `<section class="card"><h3>Movimientos del día</h3><div class="list">${[...ex, ...inc].sort((a, b) => b.createdAt - a.createdAt).map(t => txRow(t)).join('')}</div></section>`;

  if (P === 'sergio' && (UI.period === 'month' || UI.period === 'year') && I > 0) {
    const g = k => sum(ex.filter(t => (catById(t.cat)?.group || 'want') === k)) + (k === 'save' ? SV : 0);
    const rows = [['need', 'Necesidades', 50, '#1FA2FF'], ['want', 'Gustos', 30, '#F15BB5'], ['save', 'Ahorro y deudas', 20, '#3DDC84']];
    h += `<section class="card"><h3>Regla 50/30/20</h3><div class="sub" style="margin-bottom:10px">Cómo repartiste tus ingresos (${short(I)}) frente a lo recomendado.</div><div class="rule">${rows.map(([k, l, ideal, col]) => { const v = g(k), p = Math.round(v / I * 100), ok = k === 'save' ? p >= ideal : p <= ideal; return `<div><div class="t"><span>${l} <span class="sub">ideal ${k === 'save' ? '≥' : '≤'} ${ideal} %</span></span><b class="${ok ? 'down' : 'up'}">${p} %</b></div><div class="bar2"><i style="width:${clamp(p, 0, 100)}%;background:${col}"></i><em style="left:${ideal}%"></em></div></div>`; }).join('')}</div></section>`;
  }

  const mm = new Map(); ex.forEach(t => { const k = methodById(t.method)?.name || 'Sin método'; mm.set(k, (mm.get(k) || 0) + t.amount); });
  if (mm.size) h += `<section class="card"><h3>Cómo pagaste</h3><div class="legend">${[...mm.entries()].sort((a, b) => b[1] - a[1]).map(([k, v], i) => `<div class="lg"><i style="background:${PAL[(i + 5) % PAL.length]}"></i><span class="n">${esc(k)}</span><span class="p">${pct(v, E)} %</span><span class="num amt">${short(v)}</span></div>`).join('')}</div></section>`;
  const tg = new Map(); ex.forEach(t => (t.tags || []).forEach(x => tg.set(x, (tg.get(x) || 0) + t.amount)));
  if (tg.size) h += `<section class="card"><h3>Por etiqueta</h3><div class="legend">${[...tg.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => `<button class="lg" data-act="searchTag" data-k="${esc(k)}" style="background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left"><span class="n">#${esc(k)}</span><span class="num amt">${short(v)}</span></button>`).join('')}</div></section>`;
  const ic = byCat(inc);
  if (ic.length) h += `<section class="card"><h3>De dónde entró la plata</h3><div class="legend">${ic.map(x => `<div class="lg"><i style="background:${x.color}"></i><span class="n">${esc(x.icon)} ${esc(x.label)}</span><span class="p">${pct(x.value, I)} %</span><span class="num amt">${short(x.value)}</span></div>`).join('')}</div></section>`;
  h += `<div class="btns"><button class="btn" data-act="exportCSV">Exportar a Excel (CSV)</button><button class="btn" data-act="printReport">Informe en PDF</button></div>`;
  return h;
}

const STACK = [];
function openSheet(sh) { STACK.push(sh); drawSheet(); }
function closeSheet() { stopRec(); STACK.pop(); drawSheet(); }
function closeAll() { stopRec(); STACK.length = 0; drawSheet(); }
function stopRec() { try { if (REC) { const r = REC; REC = null; r.onend = null; r.abort(); } } catch { } }
function drawSheet(keepScroll) {
  const root = $('#sheets'); const top = STACK[STACK.length - 1];
  if (!top) { root.innerHTML = ''; return; }
  const prevScroll = keepScroll ? ($('.sheet', root)?.scrollTop || 0) : 0;
  root.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(top.title)}"><div class="grab"></div><div class="sh">${STACK.length > 1 ? `<button class="ib" data-act="back" aria-label="Atrás">${IC.left}</button>` : ''}<h2>${esc(top.title)}</h2><button class="ib" data-act="close" aria-label="Cerrar">${IC.x}</button></div><div class="body">${top.render()}</div></div></div>`;
  const sh = $('.sheet', root); sh.scrollTop = prevScroll;
  top.mount && top.mount(sh);
}
const redrawSheet = () => STACK.length && drawSheet(true);
function refresh() { render(); redrawSheet(); }
function confirmSheet(title, msg, okLabel, onOk, danger = true) {
  openSheet({ title, render: () => `<p class="note" style="font-size:15px;margin:0">${msg}</p><div class="btns"><button class="btn ghost" data-act="back">Cancelar</button><button class="btn ${danger ? 'danger' : 'pri'}" id="cOk">${esc(okLabel)}</button></div>`, mount: el => { $('#cOk', el).onclick = async () => { closeSheet(); await onOk(); }; } });
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg.replace(/<[^>]+>/g, '');
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- Imágenes (se comprimen en el teléfono) ---------- */
function readImage(file, max = 1100, q = .7) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
function squareImage(file, size = 320) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const m = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

async function saveTx() {
  const el = $('.sheet'); syncF(el);
  if (F.quickIdx != null) { if (!F.cat) return toast('Elige una categoría', 'bad'); return quickFromForm(); }
  const raw = parseAmt(F.amountTxt);
  if (!raw) return toast('Escribe el monto', 'bad');
  if (!F.cat) return toast('Elige una categoría', 'bad');
  const rate = F.cur === 'COP' ? 1 : (S.settings.rates[F.cur] || 1), amount = Math.round(raw * rate);
  const tags = (F.note.match(/#[\wáéíóúñü]+/gi) || []).map(t => t.slice(1).toLowerCase());
  let rid = F.receipt;
  if (F.receiptNew) { rid = rid || uid(); await putReceipt(rid, F.receiptNew); }
  const base = { profile: F.profile, kind: F.kind, cat: F.cat, sub: F.sub, method: F.method, note: F.note.trim(), tags, receipt: rid || null, orig: F.cur !== 'COP' ? { cur: F.cur, amt: raw } : null, paidBy: F.kind === 'expense' && F.paidBy ? other(F.profile) : null };
  if (F.id) {
    const t = S.tx.find(x => x.id === F.id);
    if (t.paidBy && !base.paidBy) t.reimbursed = false;
    Object.assign(t, base, { amount, date: F.date });
  } else if (F.cuotas > 1) {
    const g = uid(), per = Math.round(amount / F.cuotas), d0 = pd(F.date);
    for (let i = 0; i < F.cuotas; i++) S.tx.push({ id: uid(), ...base, receipt: i === 0 ? base.receipt : null, amount: i === F.cuotas - 1 ? amount - per * (F.cuotas - 1) : per, date: ds(addMonths(d0, i)), inst: { g, i: i + 1, n: F.cuotas }, createdAt: Date.now() + i });
  } else S.tx.push({ id: uid(), ...base, amount, date: F.date, createdAt: Date.now() });
  persist(); closeAll();
  toast(F.id ? 'Cambios guardados' : (F.kind === 'income' ? 'Ingreso registrado' : 'Gasto registrado') + (F.cuotas > 1 ? ` en ${F.cuotas} cuotas` : ''));
  if (F.kind === 'expense') checkAlerts(F.profile);
  render();
}
function delTx() {

        toast('Cambiando PIN…');
        const salt = crypto.getRandomValues(new Uint8Array(16)), nk = await deriveKey(a, salt);
        for (const k of (await DB.keys()).filter(k => String(k).startsWith('r:'))) { const bytes = await unseal(oldKey, await DB.get(k)); await DB.set(k, await seal(nk, bytes)); }
        KEY = nk; VSALT = salt; await saveNow(); closeSheet(); toast('PIN cambiado');
      };
    },
  });
}

/* Copias de seguridad y exportación */
async function saveFile(name, blob) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); return true;
}
async function backup() {
  await saveNow();
  const v = await DB.get('vault'), receipts = {};
  for (const k of (await DB.keys()).filter(k => String(k).startsWith('r:'))) receipts[k] = await DB.get(k);
  const blob = new Blob([JSON.stringify({ app: 'billetera', v: 1, created: new Date().toISOString(), vault: v, receipts })], { type: 'application/json' });
  const ok = await saveFile(`billetera-copia-${today()}.billetera.json`, blob);
  if (ok) { S.settings.lastBackup = today(); persist(); refresh(); toast('Copia cifrada lista'); }
}

  openSheet({

    render: () => `<section class="card note" style="display:flex;flex-direction:column;gap:8px"><b>Copia de seguridad cifrada</b><span>Como tus datos viven solo en este teléfono, guarda una copia cada semana en <b>Archivos › iCloud Drive</b>. La copia va cifrada y solo abre con tu PIN.</span><button class="btn pri block" data-act="backup">Hacer copia ahora</button><label class="btn ghost block" for="impF">Restaurar desde una copia</label><input type="file" id="impF" accept=".json,application/json" hidden></section>

      <section class="card note" style="display:flex;flex-direction:column;gap:8px"><b>Exportar para Excel o tu contador</b><span>El archivo CSV <b>no va cifrado</b>. Compártelo solo con quien deba verlo.</span><button class="btn block" data-act="exportCSV">Exportar movimientos (CSV)</button><button class="btn block" data-act="printReport">Informe del periodo en PDF</button></section>`,

function restoreSheet(data) {
  openSheet({
    title: 'Restaurar copia',

  else if (e.key === 'Escape' && STACK.length) closeSheet();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });

/* ---------- Inicio ---------- */
(function init() {
  if (!window.crypto?.subtle) { $('#lock').innerHTML = `<h1>Navegador no compatible</h1><p>Abre la app en Safari actualizado.</p>`; return; }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => { });
  showLock();
})();

</script>
